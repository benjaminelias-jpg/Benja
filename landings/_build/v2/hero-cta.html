<!-- HERO VARIANTE (a) — CTA DIRECTO, sin formulario. Súper-CTA naranja a
         WhatsApp (la acción suprema de la pieza) y, debajo, el secundario que
         abre la página de calendario del vendedor (no se incrusta). El filtro lo hacen la topbar y el subtítulo.
         #hero-cta envuelve el bloque, igual que en el patrón.
         PERSONALIZACIÓN: .kf-solo-equipo se ve sin vendedor en la URL;
         .kf-solo-vendedor, con vendedor. Los `data-v` son la plantilla del
         texto con vendedor ({nombre}, {ig}); el script los rellena.
         (Este div se cierra después del microtrust.) -->
    <div class="hero-cta" id="hero-cta">
      <div class="kf-equipo-mini kf-solo-equipo" aria-hidden="true">
        <img src="equipo/taiab.jpg" alt=""><img src="equipo/rafa.jpg" alt=""><img src="equipo/juan.jpg" alt=""><img src="equipo/jorge.jpg" alt="">
        <span>Taiab, Rafa, Juan y Jorge</span>
      </div>
      <div class="kf-vendedor-hero kf-solo-vendedor">
        <img data-v-src="equipo/{id}.jpg" data-v-alt alt="">
        <span data-v="<strong>Te atiende {nombre}</strong>@{ig} · equipo de Kunfupay"></span>
      </div>
      <div class="kf-hero-ctas">
        <a href="#agenda" class="btn btn-super-cta" id="kf-wa-btn" rel="noopener" data-v="Escríbele a {nombre} por WhatsApp">Escríbenos por WhatsApp</a>
        <a href="#agenda" class="btn btn-secundario kf-agendar" id="kf-agendar-btn" data-v="Agenda una llamada con {nombre}">Prefiero agendar una llamada</a>
      </div>
