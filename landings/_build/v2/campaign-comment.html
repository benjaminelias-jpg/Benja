     CAMPAÑA REMARKETING · VENDEDORES · v2 (una landing, vendedor por URL)
     =====================================================================
     UNA sola landing para todo el equipo. El anuncio de cada vendedor
     lleva `?vendedor=<id>` (o su id en utm_content) y la página enseña
     SOLO a esa persona: foto, nombre, WhatsApp y calendario. Sin id, sale
     la versión de equipo. Ver la config del <head> (KF_VENDEDORES).
     La v1 (equipo) y /landings/vendedor-<id>/v1 siguen existiendo.

     Derivada de /landings/fiscal/v1. Lo de arriba del pliegue es el mismo
     del patrón: topbar, hero oscuro con ondas, logo, titular con subrayado,
     subtítulo y prensa. Cambian:
       · el copy (topbar, titular, subtítulo, microtrust),
       · el quiz: SIN formulario, solo los dos CTA (variante (a) del patrón),
       · todo lo de debajo del hero: el equipo de ventas y el calendario.
     Sin barra fija inferior.

     PARA QUIÉN. Anuncio «RMK 3 / AUDIENCIA VENDEDORES» de la campaña
     «🔴 REMARKETING / KUNFUPAY», que solo llega a
     «Audiencia_puerta_fria_instagram»: gente que ha visitado los perfiles
     de Instagram del equipo de ventas. El creativo es un tuit de Kunfupay

     te mostramos cómo cobrarles a todos» y «Te responde una persona, no un
     bot». La landing repite esa promesa y esas caras (message match).

     CONVERSIÓN Y MEDICIÓN. 100 % web: el anuncio NO abre WhatsApp, abre esta
     página, y el píxel ve cada paso.
       · CTA principal (súper-CTA naranja): «Escríbenos por WhatsApp».

       · CTA secundario: «Agenda una llamada con <vendedor>» → abre SU página

       · Con vendedor, su recorte sin fondo sale grande detrás del titular,

       · El filtro lo hacen la topbar («Para quien ya vende cursos…») y el
         subtítulo, no un formulario.
