<style>
:root{
  --bg:#f8f8f8; --ink:#2e2e30; --ink-strong:#1e1e20; --muted:#6f6f73; --faint:#9b98a6;
  --line:#e7e4ef; --acc:#5B2EE8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-align:center;
}
.logo{position:fixed;top:24px;left:26px;height:38px;width:auto}
.card{width:min(520px,100%)}
.tick{
  width:62px;height:62px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--acc);color:#fff;font-size:27px;line-height:1;
  animation:pop .5s cubic-bezier(.2,1.2,.3,1) both;
}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:500;line-height:1.1;letter-spacing:-.034em;color:var(--ink-strong)}
p.sub{margin-top:16px;font-size:16.5px;line-height:1.6;color:var(--muted)}
p.sub b{color:var(--ink-strong);font-weight:500}
.mail{
  display:inline-block;margin-top:18px;padding:10px 16px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:15px;color:var(--ink-strong)
}
.barra{width:min(320px,100%);height:2px;margin:34px auto 0;background:#e7e4ef;overflow:hidden;border-radius:2px}
.barra i{display:block;height:100%;width:0;background:var(--acc);animation:cargar 3s linear forwards}
@keyframes cargar{from{width:0}to{width:100%}}
.cta{
  --mx:50%; --my:50%;
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;
  min-height:52px;margin-top:26px;padding:0 28px;border:0;border-radius:9px;
  background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;
  font:500 15px/1 'Inter',sans-serif;letter-spacing:-.008em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 1px 2px rgba(74,34,204,.28);
  transition:transform .2s cubic-bezier(.22,.8,.2,1), box-shadow .2s ease, background .2s ease;
}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(130px circle at var(--mx) var(--my), rgba(255,255,255,.18), transparent 62%)}
.cta:hover{transform:translateY(-1px);background:#5527e0}
.cta:hover::before{opacity:1}
.cta:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.nota{margin-top:16px;font-size:12.5px;color:var(--faint)}
@media (prefers-reduced-motion:reduce){ .tick,.barra i{animation:none} .barra i{width:100%} }
</style>
</head>
<body>

<img class="logo" src="assets/logo-classroom.png" alt="Classroom by kunfupay">

<main class="card">
  <div class="tick" aria-hidden="true">✓</div>
  <h1>Listo, ya tienes sitio.</h1>
  <p class="sub">Te llevamos a crear tu contraseña. Tu correo ya va puesto: <b>solo eliges contraseña
    y entras</b>.</p>
  <p class="mail" id="mail" hidden></p>

  <div class="barra" aria-hidden="true"><i></i></div>

  <a class="cta" id="ir" href="https://classroom.kunfupay.com/signup">Crear mi contraseña ahora
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" width="15" height="15"><path d="M2 8h11M9 4l4 4-4 4"
      stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <p class="nota">Si no pasa nada en unos segundos, pulsa el botón.</p>
</main>

<script>
(function () {
  var SIGNUP = 'https://classroom.kunfupay.com/signup';   // destino final
  var ESPERA = 3000;                                      // 3 s para que el píxel registre la visita

  var params = new URLSearchParams(window.location.search);

  // el correo llega por la URL; si no, por la cookie de .kunfupay.com o por localStorage
  function cookie(n) {
    var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }
  var email = (params.get('email') || cookie('kf_lead_email') ||
    (function () { try { return JSON.parse(localStorage.getItem('kf_lead') || '{}').email || ''; }
                   catch (e) { return ''; } })()).trim();

  if (email) {
    var caja = document.getElementById('mail');
    caja.textContent = email;
    caja.hidden = false;
  }

  // arrastra los UTM de la campaña hasta el alta
  var extra = [];
  params.forEach(function (v, k) { if (k !== 'email') extra.push(k + '=' + encodeURIComponent(v)); });
  var destino = SIGNUP + (email ? '?email=' + encodeURIComponent(email) : '') +
    (extra.length ? (email ? '&' : '?') + extra.join('&') : '');
  document.getElementById('ir').href = destino;

  // ── medición: lead potencial (aún no factura o viene a crear su primera comunidad).
  //    La página es idéntica a /gracias a propósito: lo que separa a los dos
  //    grupos es la URL y el evento, no lo que ve la persona. ──
  function guardado(k) {
    try { return (JSON.parse(localStorage.getItem('kf_lead') || '{}')[k]) || ''; } catch (e) { return ''; }
  }
  var datos = {
    segmento: params.get('segmento') || 'potencial',
    modelo: params.get('tiene_comunidad') || guardado('tiene_comunidad'),
    facturacion: params.get('facturacion') || guardado('facturacion'),
    origen: params.get('origen') || '',
    utm_source: params.get('utm_source') || '',
    utm_campaign: params.get('utm_campaign') || '',
    utm_content: params.get('utm_content') || ''
  };
  window.fbq && fbq('track', 'Lead', { segmento: datos.segmento, modelo: datos.modelo,
    facturacion: datos.facturacion });
  window.fbq && fbq('trackCustom', 'lead_potencial', datos);
  window.dataLayer.push(Object.assign({ event: 'lead_potencial', email_presente: !!email }, datos));
  // Si usáis conversión de Google Ads, aquí va su disparo:
  // window.gtag && gtag('event', 'conversion', {send_to: 'AW-XXXXXXXXX/XXXXXXXX'});

  setTimeout(function () { window.location.href = destino; }, ESPERA);

  var b = document.querySelector('.cta');
  b.addEventListener('pointermove', function (e) {
    var r = b.getBoundingClientRect();
    b.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    b.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
})();
</script>
</body>
</html>
