<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Kunfupay Páginas isotipo">
  <title>Kunfupay Páginas — isotipo</title>
  <desc>Escaparate (toldo de tienda) en negativo sobre app-icon de gradiente azul (info-500 → info-700). Mismo contrato visual que tienda.svg / classroom.svg (squircle rx 116, gradiente diagonal 500→700 de su familia, filo de luz superior).</desc>
  <defs>
    <!-- Gradiente de familia (variedad cromática entre iconos de producto) -->
    <linearGradient id="pagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Filo de luz interior (sello Morfeo) -->
    <linearGradient id="pagEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App-icon tile: gradiente azul (info-500 → info-700), esquina superredondeada -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#pagGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#pagEdge)"/>

  <!-- ESCAPARATE en negativo (blanco). Mismo glifo que ya usaba la fila
       "Páginas" en contorno (lucide store, espacio 24×24, el que pasó
       Hernán), escalado ×11 y centrado: 24 × 11 = 264 → (512-264)/2 = 124. -->
  <g transform="translate(124 124) scale(11)"
     fill="none" stroke="#ffffff" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"/>
    <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"/>
    <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"/>
  </g>
</svg>
