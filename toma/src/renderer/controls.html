<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
      font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
    .bar {
      position: absolute; inset: 6px; border-radius: 28px; background: rgba(20,22,28,.94);
      border: 1px solid rgba(255,255,255,.12); display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 8px 0; -webkit-app-region: drag; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    button {
      -webkit-app-region: no-drag; border: 0; cursor: pointer; color: #fff; background: transparent;
      width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover { background: rgba(255,255,255,.12); }
    .stop { background: #ff5a36; }
    .stop:hover { background: #ff7a5c; }
    .sq { width: 13px; height: 13px; background: #fff; border-radius: 3px; }
    .time { font-variant-numeric: tabular-nums; text-align: center; min-height: 16px; line-height: 16px; }
    .time.big { font-size: 22px; min-height: 24px; line-height: 24px; }
    .paused .time { color: #ffcc4d; }
    .sep { width: 26px; height: 1px; background: rgba(255,255,255,.15); margin: 2px 0; }
    .grip { flex: 1; width: 100%; }
    svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <button class="stop" id="stop" title="Terminar grabación (Alt+Shift+R)"><span class="sq"></span></button>
    <div class="time" id="time">0:00</div>
    <button id="pause" title="Pausar / reanudar (Alt+Shift+P)">
      <svg id="ico-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      <svg id="ico-play" viewBox="0 0 24 24" style="display:none"><path d="M7 5l12 7-12 7z" fill="#fff"/></svg>
    </button>
    <button id="restart" title="Reiniciar grabación"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <div class="sep"></div>
    <button id="cancel" title="Descartar grabación (Alt+Shift+C)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <div class="grip" title="Arrastra para mover"></div>
  </div>
  <script src="controls.js"></script>
</body>
</html>
