<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Cuenta regresiva</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .disc {
      position: absolute; inset: 20px; border-radius: 50%; background: rgba(14, 15, 19, .82);
      display: grid; place-items: center; color: #fff;
      font: 800 130px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      box-shadow: 0 0 0 6px rgba(255, 90, 54, .9);
      opacity: 0;
    }
    .disc.show { opacity: 1; }
    .disc span { display: block; }
    .disc span.tick { animation: tick .9s ease-out; }
    @keyframes tick { 0% { transform: scale(1.5); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 100% { transform: scale(.92); opacity: .85; } }
  </style>
</head>
<body>
  <div class="disc" id="disc"><span id="n"></span></div>
  <script src="countdown.js"></script>
</body>
</html>
