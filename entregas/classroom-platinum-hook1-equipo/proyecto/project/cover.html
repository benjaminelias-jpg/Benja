<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada</title><style>
@font-face{font-family:"Inter";src:url("node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;}
@font-face{font-family:"Inter";src:url("node_modules/@fontsource-variable/inter/files/inter-latin-ext-opsz-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;unicode-range:U+0100-024F,U+20AC;}
:root{ --violet:#6B4BFF; --lavender:#C3B4FF; --glow:#A88CFF; --white:#FFFFFF; --ink:#16132B; --black:#0B0B0F; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--black);}
body{font-family:"Inter",sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;color:#fff;}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--black);}

/* ---------- video ---------- */
/* fondo: el mismo video, desenfocado (lo que queda fuera de la máscara) */
#bgv{position:absolute;left:-180px;top:-320px;width:1440px;height:2560px;filter:blur(40px) brightness(.5) saturate(.85);opacity:0;}
#camwrap{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;}
#cam,#camOverlay{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;}
/* resaltador sobre la tiza de la pizarra (sigue a la pizarra frame a frame) */
#hl{position:absolute;left:0;top:0;height:50px;border-radius:10px;background:var(--violet);mix-blend-mode:lighten;opacity:0;transform-origin:0 50%;}
/* marco simple del video achicado: redondeado, borde fino, sin volumen */
#pipFrame{position:absolute;inset:0;border-radius:inherit;border:1.5px solid rgba(255,255,255,.26);pointer-events:none;opacity:0;}

/* ---------- GLASS: receta única para todo el video ---------- */
.glass{
  --gb:30; --gs:1.15; --gbr:.80; --r:64px;
  position:absolute; border-radius:var(--r);
  border:1.5px solid rgba(255,255,255,.85);
  background:
    radial-gradient(48% 42% at 98% 104%, rgba(168,140,255,.74) 0%, rgba(168,140,255,.26) 45%, transparent 100%),
    radial-gradient(80% 30% at 30% 106%, rgba(210,198,255,.22) 0%, transparent 100%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 45%, rgba(255,255,255,.05));
  -webkit-backdrop-filter: blur(calc(var(--gb) * 1px)) saturate(var(--gs)) brightness(var(--gbr));
  backdrop-filter: blur(calc(var(--gb) * 1px)) saturate(var(--gs)) brightness(var(--gbr));
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.55),
    inset 0 24px 32px -18px rgba(255,255,255,.55),
    inset 0 0 56px 4px rgba(226,218,255,.55),
    inset 0 -30px 48px -16px rgba(190,172,255,.45),
    0 50px 100px -28px rgba(30,16,80,.65),
    0 16px 40px -18px rgba(30,16,80,.32);
  opacity:0;
}
.glass .edge{position:absolute;inset:-1.5px;border-radius:inherit;padding:2.5px;pointer-events:none;opacity:0;
  --sa:0deg;
  background:conic-gradient(from var(--sa), transparent 0deg, transparent 300deg, rgba(255,255,255,.0) 312deg, rgba(255,255,255,.95) 336deg, rgba(235,228,255,.0) 352deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);}

/* ---------- tipografía ---------- */
.titulo{color:#fff;font-weight:700;letter-spacing:-.025em;line-height:1.04;text-shadow:0 2px 18px rgba(20,8,60,.35);}
.apoyo{color:rgba(255,255,255,.92);font-weight:600;font-size:28px;letter-spacing:-.005em;line-height:1.25;text-shadow:0 1px 12px rgba(20,8,60,.35);}
.acento{color:var(--lavender);}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--violet);color:#fff;border-radius:999px;font-weight:600;font-size:25px;line-height:1;padding:13px 22px 14px;letter-spacing:-.005em;}
.num{font-weight:700;letter-spacing:-.04em;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 2px 24px rgba(20,8,60,.35);}

/* ---------- subtítulos: texto simple con sombra suave ---------- */
#subs{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;}
.sg{position:absolute;left:540px;top:1212px;white-space:nowrap;opacity:0;
  font-weight:600;font-size:56px;letter-spacing:-.02em;line-height:1;display:flex;gap:15px;align-items:center;}
.sg .w{color:#fff;text-shadow:0 0 24px rgba(10,4,34,.78),0 0 8px rgba(10,4,34,.55),0 2px 3px rgba(10,4,34,.5);}
.sg .w.pw{position:relative;z-index:0;text-shadow:none;}
.sg .w.pw .pbg{position:absolute;left:-15px;right:-15px;top:-10px;bottom:-12px;background:var(--violet);border-radius:999px;z-index:-1;opacity:0;}

/* ---------- elementos ---------- */
.card{padding:46px 52px 52px;}
.row{display:flex;align-items:center;gap:22px;height:76px;border-top:1px solid rgba(255,255,255,.15);}
.row:first-of-type{border-top:none;}
.row .ic{width:48px;height:48px;flex:none;}
.row .tx{font-weight:600;font-size:32px;letter-spacing:-.015em;flex:1;color:#fff;}
.check{width:42px;height:42px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;flex:none;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--violet);color:#fff;font-weight:600;font-size:24px;flex:none;}
svg.line{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
<style>.glass{opacity:1}#bg{position:absolute;inset:0;width:1080px;height:1920px}</style></head><body>
<div id="stage"><img id="bg" src="frames/f00094.jpg">
<div class="glass card" style="left:150px;top:880px;width:780px;--r:78px;--gbr:.88;padding:42px 52px 50px;">
<span class="pill">Buscamos creadores</span>
<div class="titulo" style="font-size:72px;margin-top:24px;">¿Facturas <span class="acento" style="position:relative">+3 mil €<span style="position:absolute;left:0;right:0;bottom:-10px;height:7px;border-radius:4px;background:#6B4BFF"></span></span><br>al mes?</div>
</div></div></body></html>
