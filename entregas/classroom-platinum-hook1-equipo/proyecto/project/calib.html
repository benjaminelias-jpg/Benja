<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1132px;background:#fff;overflow:hidden}
/* ---------- GLASS: receta única para todo el video ---------- */
.glass{
  --gb:30; --gs:1.15; --gbr:.80; --r:64px;
  position:absolute; border-radius:var(--r);
  border:1.5px solid rgba(255,255,255,.85);
  background:
    radial-gradient(48% 42% at 98% 104%, rgba(168,140,255,.74) 0%, rgba(168,140,255,.26) 45%, transparent 100%),
    radial-gradient(80% 30% at 30% 106%, rgba(210,198,255,.22) 0%, transparent 100%),
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03) 45%, rgba(255,255,255,.05));
  -webkit-backdrop-filter: blur(calc(var(--gb) * 1px)) saturate(var(--gs)) brightness(var(--gbr));
  backdrop-filter: blur(calc(var(--gb) * 1px)) saturate(var(--gs)) brightness(var(--gbr));
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.55),
    inset 0 24px 32px -18px rgba(255,255,255,.55),
    inset 0 0 56px 4px rgba(226,218,255,.55),
    inset 0 -30px 48px -16px rgba(190,172,255,.45),
    0 50px 100px -28px rgba(30,16,80,.65),
    0 16px 40px -18px rgba(30,16,80,.32);
  opacity:0;
}
/* chip / pill de vidrio: misma receta, radio 999 y blur 20 */
.glass.chip{--gb:20; --r:999px;}
/* destello de luz que recorre el borde una vez */
.glass .edge{position:absolute;inset:-1.5px;border-radius:inherit;padding:2.5px;pointer-events:none;opacity:0;
  --sa:0deg;
  background:conic-gradient(from var(--sa), transparent 0deg, transparent 300deg, rgba(255,255,255,.0) 312deg, rgba(255,255,255,.95) 336deg, rgba(235,228,255,.0) 352deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);}


.glass{opacity:1}
</style></head><body><div class="glass" style="left:154px;top:104px;width:754px;height:754px;--r:94px;"></div></body></html>
