<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sistema de tarjetas</title>
<!--
  Motor de la plantilla "sistema de tarjetas" (9:16, 1080×1920).
  NO edites este archivo para cambiar el contenido: todo el contenido está en config.js.
  El motor calcula la línea de tiempo a partir del texto (tiempos de lectura), construye
  las tarjetas y expone window.COMP para render.cjs y window.render(t) para cada instante.
-->
<style>
  @font-face { font-family: "MG Inter"; font-weight: 500; src: url("assets/fonts/Inter-Medium.otf"); }
  @font-face { font-family: "MG Display"; font-weight: 600; src: url("assets/fonts/InterDisplay-SemiBold.otf"); }
  :root { --bg: #0B111E; --ink: #FFFFFF; --accent: #4CC9F0; --accent-rgb: 76, 201, 240; --amb1: 30, 48, 82; --amb2: 17, 27, 46; --card1: 31, 45, 72; --card2: 15, 22, 38; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #world { position: absolute; inset: 0; transform-origin: 540px 860px; }
  #bg { position: absolute; left: -80px; top: -80px; width: 1240px; height: 2080px; background: var(--bg); }
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 680px 600px at 620px 940px, rgba(var(--amb1), 0.80), rgba(var(--amb1), 0) 72%),
      radial-gradient(ellipse 900px 1300px at 620px 1000px, rgba(var(--amb2), 0.70), rgba(var(--amb2), 0) 75%);
  }
  #glow {
    position: absolute; inset: 0; opacity: 0.05;
    background: radial-gradient(ellipse 560px 460px at 620px 880px, rgba(var(--accent-rgb), 1), rgba(var(--accent-rgb), 0) 70%);
  }
  .bokeh { position: absolute; border-radius: 50%; }
  #scene { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 540px 860px; }

  #intro { position: absolute; inset: 0; z-index: 3000; }
  #introBlock { position: absolute; left: 540px; top: 860px; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
  .mask { overflow: hidden; }
  #kicker {
    font-family: "MG Inter", sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3;
    letter-spacing: 0.34em; padding-left: 0.34em; color: rgba(255, 255, 255, 0.62);
  }
  #mKicker { margin-bottom: 18px; }
  .tline { font-family: "MG Display", sans-serif; font-weight: 600; font-size: 96px; line-height: 1.06; letter-spacing: 0.01em; color: var(--ink); }
  em { font-style: normal; color: var(--accent); }

  .card {
    position: absolute; left: 130px; width: 820px;
    background: linear-gradient(135deg, rgba(var(--card1), 0.95), rgba(var(--card2), 0.95));
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    perspective: 1400px;
  }
  .content { position: absolute; top: 0; display: flex; align-items: center; }
  .num { font-family: "MG Display", sans-serif; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
  .cline { width: 3px; border-radius: 2px; background: var(--accent); }
  .ctitle { font-family: "MG Display", sans-serif; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); white-space: nowrap; }
  .obj { position: absolute; }
  .obj img { display: block; width: 100%; height: 100%; }
  .obj .sweep {
    position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 58%);
    background-size: 300% 100%; -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  }
  .cap { position: absolute; left: 0; width: 1080px; transform: translateY(-50%); text-align: center; z-index: 4000; }
  .cap .mask { display: inline-block; padding: 0 12px 0.1em; }
  .cap .txt { display: inline-block; font-family: "MG Display", sans-serif; font-weight: 600; letter-spacing: 0.005em; color: var(--ink); white-space: nowrap; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 64% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%); }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bg"><div id="ambient"></div><div id="glow"></div><div id="bokeh"></div></div>
    <div id="scene">
      <div id="intro"><div id="introBlock"></div></div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="black"></div>
</div>
<script src="config.js"></script>
<script>
(async function () {
  const C = window.CONFIG;
  const FPS = C.fps || 30, TAU = Math.PI * 2;
  const warnings = [];
  const $ = id => document.getElementById(id);

  // ---------- paleta ----------
  const hex = h => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const pal = Object.assign({ bg: "#0B111E", accent: "#4CC9F0" }, C.palette || {});
  const root = document.documentElement.style;
  root.setProperty("--bg", pal.bg);
  root.setProperty("--accent", pal.accent);
  root.setProperty("--accent-rgb", hex(pal.accent).join(", "));
  const ACC = hex(pal.accent).join(",");
  const tone = k => hex(pal.bg).map(v => Math.min(255, Math.round(v * k))).join(", ");
  root.setProperty("--amb1", tone(2.75)); root.setProperty("--amb2", tone(1.55));
  root.setProperty("--card1", tone(2.75)); root.setProperty("--card2", tone(1.3));

  // ---------- curvas ----------
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const lin = x => x;
  const outQuart = x => 1 - Math.pow(1 - x, 4);          // cubic-bezier(0.25, 1, 0.5, 1)
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inCubic = x => x * x * x;
  const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const inOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const prog = (t, f0, len) => clamp01((t * FPS - f0) / len);
  function mix(a, b, e) {
    if (typeof a === "number") return a + (b - a) * e;
    const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * e; return o;
  }
  function kf(t, keys) {
    const f = t * FPS;
    if (f <= keys[0][0]) return keys[0][1];
    for (let k = 1; k < keys.length; k++) {
      if (f <= keys[k][0]) {
        const [f0, v0] = keys[k - 1], [f1, v1, ease] = keys[k];
        return mix(v0, v1, (ease || lin)(f1 === f0 ? 1 : (f - f0) / (f1 - f0)));
      }
    }
    return keys[keys.length - 1][1];
  }

  // ---------- texto: *palabra* = acento ----------
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const fmt = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const words = s => s.replace(/\*/g, "").trim().split(/\s+/).filter(Boolean).length;
  const readF = s => Math.ceil((words(s) / 3 + 1) * FPS);    // regla de la skill: palabras ÷ 3 + 1 s

  // ---------- carga de fuentes e imágenes ----------
  await Promise.all([document.fonts.load('600 96px "MG Display"'), document.fonts.load('500 32px "MG Inter"')]);
  const P = C.points;
  const N = P.length;
  if (N < 1 || N > 5) warnings.push(`El sistema está pensado para 1–5 puntos (hay ${N}).`);
  const imgs = await Promise.all(P.map(p => p.image ? new Promise((ok, ko) => {
    const im = new Image(); im.onload = () => im.decode().then(() => ok(im)); im.onerror = () => ko(new Error("No carga " + p.image)); im.src = p.image;
  }) : null));

  // ---------- geometría ----------
  const CARD_H = Math.min(200, Math.floor((960 - (N - 1) * 20) / N));
  const K = CARD_H / 200;                          // escala del contenido de la tarjeta
  const GAP = 20;
  const LIST_Y = P.map((_, i) => 880 + (i - (N - 1) / 2) * (CARD_H + GAP));
  const THUMB = { w: 175 * K, h: 150 * K };
  const SLOT_X = 410 - 30 - 80 * K;
  const HERO = { x: 540, y: 810, maxW: 760, maxH: 560 };
  const CAP_Y = 1170;
  const LIST = i => ({ y: LIST_Y[i], s: 1, z: 0, b: 0, o: 1 });
  const ENTER = i => ({ y: LIST_Y[i] + 160, s: 1, z: -200, b: 4, o: 0 });
  const CENTER = { y: 880, s: 1.15, z: 0, b: 0, o: 1 };
  const HEADER = { y: 400, s: 0.8, z: 0, b: 0, o: 1 };
  const REC = (j, i) => ({ y: 880 + (j - i) * 260, s: 1, z: -520, b: 9, o: 0.28 });

  // ---------- línea de tiempo (en fotogramas) ----------
  const intro = C.intro || { kicker: "", lines: [] };
  const introText = [intro.kicker || "", ...(intro.lines || [])].join(" ");
  const T = {};
  T.introIn = 15;
  T.introHit = 21 + 9;                              // la primera línea frena visualmente 9 f después de empezar
  T.introOut = Math.max(90, T.introIn + readF(introText) - 12);
  T.enter = T.introOut + 12;
  T.listDone = T.enter + 4 * (N - 1) + 16;
  T.P = []; T.L = []; T.S = []; T.capIn = [];
  let cursor = T.listDone + 24;
  P.forEach((p, k) => {
    T.P[k] = cursor;
    T.L[k] = cursor + 50;
    T.capIn[k] = T.L[k] + 6;
    T.S[k] = T.capIn[k] + Math.max(readF(p.caption || ""), 72);
    cursor = T.S[k] + 4;
  });
  const R = T.S[N - 1];
  T.recapHit = R + 30;
  T.pulse = P.map((_, i) => R + 34 + 4 * i);
  T.fade = R + 34 + 4 * (N - 1) + 36;
  T.end = T.fade + 20;

  // ---------- keyframes de cada tarjeta ----------
  const CARD_KEYS = P.map((_, i) => {
    const k0 = T.enter + 4 * i;
    const keys = [[0, ENTER(i)], [k0, ENTER(i)], [k0 + 16, LIST(i), outQuart]];
    for (let k = 0; k < N; k++) {
      const Pk = T.P[k];
      if (k === 0) {
        keys.push([Pk, LIST(i)]);
        keys.push(i === 0 ? [Pk + 18, CENTER, outQuart] : [Pk + 20, REC(i, 0), outCubic]);
      } else {
        const Sp = T.S[k - 1];
        if (i === k - 1) keys.push([Sp, HEADER], [Sp + 20, REC(i, k), inOutCubic]);
        else if (i === k) keys.push([Pk, REC(i, k - 1)], [Pk + 18, CENTER, outQuart]);
        else keys.push([Sp, REC(i, k - 1)], [Sp + 20, REC(i, k), inOutCubic]);
      }
      if (i === k) keys.push([Pk + 30, CENTER], [Pk + 50, HEADER, inOutCubic]);
    }
    // Recap: la última baja primero; las demás avanzan después desde el fondo (sin cruzarse en foco)
    if (i === N - 1) keys.push([R, HEADER], [R + 16, LIST(i), inOutCubic]);
    else keys.push([R + 12, REC(i, N - 1)], [R + 32, LIST(i), outCubic]);
    return keys;
  });
  const OUT_KEYS = P.map((_, k) => k === N - 1
    ? [[0, 0], [T.P[k] + 30, 0], [T.L[k], 1, outQuart], [R, 1], [R + 12, 0, inOutCubic]]
    : [[0, 0], [T.P[k] + 30, 0], [T.L[k], 1, outQuart], [T.S[k], 1], [T.S[k] + 16, 0, inOutCubic]]);
  const FOCUS_KEYS = [[0, 0], [T.P[0], 0], [T.P[0] + 20, 1, inOutSine], [R + 12, 1], [R + 32, 0, inOutSine]];
  const HITS = [[T.introHit, 0.06], ...T.L.map(l => [l, 0.035]), [T.recapHit, 0.06]];

  // ---------- señales para el audio ----------
  const cues = [
    { f: T.introHit, type: "riser_corto" }, { f: T.introHit, type: "hit_grave" },
    { f: T.enter, type: "whoosh" },
  ];
  P.forEach((p, k) => {
    cues.push({ f: T.P[k], type: "whoosh" });
    if (imgs[k]) {
      cues.push({ f: T.P[k] + 32, type: "whoosh_suave" });
      cues.push({ f: T.L[k], type: "hit_suave" });
      if (p.foley) cues.push({ f: T.L[k], type: "foley", name: p.foley });
    }
  });
  cues.push({ f: R + 8, type: "whoosh" }, { f: T.recapHit, type: "riser_largo" }, { f: T.recapHit, type: "hit_grave" });

  // ---------- intro ----------
  $("introBlock").innerHTML =
    (intro.kicker ? `<div class="mask" id="mKicker"><div id="kicker">${fmt(intro.kicker)}</div></div>` : "") +
    (intro.lines || []).map((l, i) => `<div class="mask"><div class="tline" id="tl${i}">${fmt(l)}</div></div>`).join("");
  const introNodes = [$("kicker"), ...(intro.lines || []).map((_, i) => $("tl" + i))].filter(Boolean);
  (intro.lines || []).forEach((_, i) => {
    const n = $("tl" + i);
    if (n.offsetWidth > 940) { n.style.fontSize = (96 * 940 / n.offsetWidth) + "px"; }
  });

  // ---------- tarjetas ----------
  const scene = $("scene");
  const cards = P.map((p, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.top = (LIST_Y[i] - CARD_H / 2) + "px";
    card.style.height = CARD_H + "px";
    card.style.borderRadius = (28 * K) + "px";
    let o = null;
    if (imgs[i]) {
      const im = imgs[i];
      const s = Math.min(HERO.maxW / im.naturalWidth, HERO.maxH / im.naturalHeight);
      o = { w: im.naturalWidth * s, h: im.naturalHeight * s };
      o.thumb = Math.min(THUMB.w / o.w, THUMB.h / o.h);
      o.rot = p.rot || 0;
    }
    card.innerHTML = `
      <div class="content" style="left:${44 * K}px;height:${CARD_H}px">
        <div class="num" style="font-size:${72 * K}px">${String(i + 1).padStart(2, "0")}</div>
        <div class="cline" style="height:${64 * K}px;margin:0 ${28 * K}px;box-shadow:0 0 2px rgba(${ACC},.9),0 0 12px rgba(${ACC},.45)"></div>
        <div class="ctitle" style="font-size:${48 * K}px">${fmt(p.title)}</div>
      </div>` + (o ? `
      <div class="obj" style="width:${o.w}px;height:${o.h}px;left:${410 - o.w / 2}px;top:${CARD_H / 2 - o.h / 2}px">
        <img src="${p.image}"><div class="sweep" style="-webkit-mask-image:url(${p.image});mask-image:url(${p.image})"></div>
      </div>` : "");
    scene.appendChild(card);
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.style.top = (o ? CAP_Y : HERO.y) + "px";
    cap.innerHTML = `<div class="mask"><div class="txt" style="font-size:${o ? 66 : 84}px">${fmt(p.caption || "")}</div></div>`;
    $("world").appendChild(cap);
    return { el: card, o, content: card.querySelector(".content"), title: card.querySelector(".ctitle"),
             line: card.querySelector(".cline"), obj: card.querySelector(".obj"), img: card.querySelector("img"),
             sweep: card.querySelector(".sweep"), cap, capTxt: cap.querySelector(".txt") };
  });

  // Ajustes de texto: títulos de tarjeta y frases que no caben
  const contentShift = cards.map(c => {
    const room = 820 - 44 * K - (c.o ? (410 - SLOT_X + THUMB.w / 2 + 24) : 44 * K);
    if (c.content.offsetWidth > room) {
      const fixed = c.content.offsetWidth - c.title.offsetWidth;
      const fs = 48 * K * (room - fixed) / c.title.offsetWidth;
      c.title.style.fontSize = fs + "px";
      if (fs < 30 * K) warnings.push(`Título de tarjeta demasiado largo: "${c.title.textContent}"`);
    }
    if (c.capTxt.offsetWidth > 940) {
      const base = parseFloat(c.capTxt.style.fontSize);
      const fs = base * 940 / c.capTxt.offsetWidth;
      c.capTxt.style.fontSize = fs + "px";
      if (fs < 46) warnings.push(`Frase demasiado larga para una línea: "${c.capTxt.textContent}"`);
    }
    return 410 - (44 * K + c.content.offsetWidth / 2);
  });

  // ---------- bokeh ----------
  const BOKEH = [
    { x: 250, y: 470, r: 120, c: ACC, a: 0.050, ph: 0.3 }, { x: 1010, y: 660, r: 72, c: "255,255,255", a: 0.035, ph: 1.9 },
    { x: 960, y: 1560, r: 160, c: ACC, a: 0.040, ph: 4.1 }, { x: 290, y: 1420, r: 64, c: "255,255,255", a: 0.030, ph: 2.7 },
    { x: 730, y: 330, r: 48, c: ACC, a: 0.040, ph: 5.2 }, { x: 500, y: 1760, r: 96, c: "255,255,255", a: 0.025, ph: 0.9 },
  ];
  const bokehEls = BOKEH.map(b => {
    const el = document.createElement("div");
    el.className = "bokeh";
    el.style.width = el.style.height = (b.r * 2) + "px";
    el.style.background = `radial-gradient(circle, rgba(${b.c},${b.a}) 0%, rgba(${b.c},${b.a * 0.85}) 48%, rgba(${b.c},0) 72%)`;
    $("bokeh").appendChild(el);
    return el;
  });

  function handheld(t) {
    const x = 0.6 * Math.sin(TAU * 0.53 * t + 1.3) + 0.3 * Math.sin(TAU * 0.97 * t + 0.4) + 0.1 * Math.sin(TAU * 1.71 * t + 2.1);
    const y = 0.6 * Math.sin(TAU * 0.47 * t + 0.2) + 0.3 * Math.sin(TAU * 0.89 * t + 2.6) + 0.1 * Math.sin(TAU * 1.83 * t + 1.1);
    const r = 0.6 * Math.sin(TAU * 0.41 * t + 0.9) + 0.4 * Math.sin(TAU * 0.77 * t + 1.7);
    return { x: x * 5, y: y * 5, r: r * 0.22 };
  }
  function reveal(node, t, f0) {
    node.style.transform = `translateY(${(1 - outQuart(prog(t, f0, 12))) * 100}%)`;
    node.style.opacity = outCubic(prog(t, f0, 10));
  }

  // ---------- render(t) ----------
  window.render = function (t) {
    const f = t * FPS;
    const push = inOutSine(clamp01(f / T.end));
    const focus = kf(t, FOCUS_KEYS);
    const h = handheld(t);
    $("world").style.transform = `translate(${h.x * 0.5}px, ${h.y * 0.5}px) rotate(${h.r}deg) scale(${(1 + 0.035 * push) * (1 + 0.025 * focus)})`;
    $("scene").style.transform = `translate(${h.x * 0.5}px, ${h.y * 0.5}px)`;
    BOKEH.forEach((b, i) => {
      const dy = -14 * Math.sin(TAU * 0.07 * t + b.ph), dx = 6 * Math.sin(TAU * 0.05 * t + b.ph * 1.7);
      bokehEls[i].style.transform = `translate(${b.x - b.r + dx}px, ${b.y - b.r + dy}px)`;
    });
    let g = 0.05;
    for (const [hf, amp] of HITS) if (f >= hf - 2) g += amp * clamp01((f - hf + 2) / 2) * Math.exp(-Math.max(0, f - hf) / (0.55 * FPS));
    $("glow").style.opacity = g;
    $("black").style.opacity = Math.max(1 - outCubic(prog(t, 0, 12)), inOutSine(prog(t, T.fade, 19)));

    // Intro
    if ($("kicker")) reveal($("kicker"), t, T.introIn);
    (intro.lines || []).forEach((_, i) => reveal($("tl" + i), t, 21 + 3 * i));
    const ie = inCubic(prog(t, T.introOut, 12));
    $("intro").style.transform = `translateZ(${-420 * ie}px)`;
    $("intro").style.opacity = 1 - ie;
    $("intro").style.filter = ie > 0.001 ? `blur(${8 * ie}px)` : "none";
    $("intro").style.visibility = ie >= 1 ? "hidden" : "visible";

    // Mientras un objeto está fuera, las tarjetas del fondo se alejan todavía más
    const heroE = Math.max(0, ...OUT_KEYS.map(k => kf(t, k)));

    cards.forEach((c, i) => {
      const p = kf(t, CARD_KEYS[i]);
      const depth = clamp01(-p.z / 520);
      p.o *= 1 - 0.55 * heroE * depth;
      p.b += 5 * heroE * depth;
      c.el.style.transform = `translate3d(0, ${p.y - LIST_Y[i]}px, ${p.z}px) scale(${p.s})`;
      c.el.style.opacity = p.o;
      c.el.style.filter = p.b > 0.05 ? `blur(${p.b}px)` : "none";
      c.el.style.zIndex = Math.round(2000 + p.z * 2 + p.s * 100);
      c.el.style.visibility = p.o < 0.002 ? "hidden" : "visible";
      const e = kf(t, OUT_KEYS[i]);                  // 0 = objeto en su hueco, 1 = protagonista
      c.content.style.transform = `translateX(${contentShift[i] * e}px)`;

      if (c.o) {
        const o = c.o;
        const slotX = 540 + p.s * SLOT_X, slotY = p.y, slotS = p.s * o.thumb;
        const since = Math.max(0, f - T.L[i]) / FPS;
        const floatY = 6 * Math.sin(TAU * 0.28 * since);
        const idleS = 1 + 0.035 * clamp01(since / 2.6);
        const arc = -70 * Math.sin(Math.PI * e);
        const ax = slotX + (HERO.x - slotX) * e;
        const ay = slotY + (HERO.y + floatY * e - slotY) * e + arc;
        const as = slotS + (idleS - slotS) * e;
        const rotZ = o.rot + 0.8 * Math.sin(TAU * 0.22 * since) * e;
        const rotY = 30 * Math.sin(Math.PI * e) * (1 - e) * 1.5;
        c.obj.style.transform = `translate(${(ax - 540) / p.s}px, ${(ay - p.y) / p.s}px) rotateY(${rotY}deg) rotate(${rotZ}deg) scale(${as / p.s})`;
        const sh = 10 + 40 * e;
        c.img.style.filter = `drop-shadow(0 ${sh * 0.7}px ${sh}px rgba(0,0,0,${0.35 + 0.25 * e}))` +
          (P[i].glow ? ` drop-shadow(0 0 ${24 * e}px rgba(${ACC},${0.22 * e}))` : "");
        const sw = prog(t, T.L[i] + 2, 24);
        c.sweep.style.backgroundPosition = `${100 - 100 * inOutSine(sw)}% 0`;
        c.sweep.style.opacity = sw > 0 && sw < 1 ? 0.55 : 0;
      }

      const pulse = Math.exp(-Math.pow((f - T.pulse[i]) / 4.5, 2));
      c.line.style.transform = `scaleY(${1 + 0.18 * pulse})`;
      c.line.style.boxShadow = `0 0 2px rgba(${ACC},0.9), 0 0 ${12 + 22 * pulse}px rgba(${ACC},${0.45 + 0.4 * pulse})`;

      // Frase
      const xe = inCubic(prog(t, T.S[i], 8));
      c.capTxt.style.transform = `translateY(${(1 - outQuart(prog(t, T.capIn[i], 12))) * 100}%) translateY(${-24 * xe}px)`;
      c.capTxt.style.opacity = outCubic(prog(t, T.capIn[i], 10)) * (1 - xe);
      c.cap.style.visibility = (f < T.capIn[i] - 1 || xe >= 1) ? "hidden" : "visible";
    });
  };

  window.COMP = {
    fps: FPS, frames: T.end, timeline: T, cues, warnings,
    warmup: T.L.map(l => l + 12),
    moving: () => [...cards.map(c => c.el), ...cards.filter(c => c.obj).map(c => c.obj), ...cards.map(c => c.capTxt), ...introNodes],
    ready: true,
  };
  window.render(0);
})().catch(err => { window.COMP = { error: String(err && err.stack || err) }; });
</script>
</body>
</html>
