<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta de sección</title>
<!--
  Motor de la plantilla "tarjeta de sección" (9:16, 1080×1920): número + línea + antetítulo/título.
  El contenido está en config.js. Expone window.COMP y window.render(t) para render.cjs.
-->
<style>
  @font-face { font-family: "MG Inter"; font-weight: 500; src: url("assets/fonts/Inter-Medium.otf"); }
  @font-face { font-family: "MG Display"; font-weight: 600; src: url("assets/fonts/InterDisplay-SemiBold.otf"); }
  :root { --bg: #0B111E; --ink: #FFFFFF; --accent: #4CC9F0; --accent-rgb: 76, 201, 240; --amb1: 30, 48, 82; --amb2: 17, 27, 46; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #world { position: absolute; inset: 0; transform-origin: 540px 880px; }
  #bg { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; background: var(--bg); }
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 640px 560px at 600px 940px, rgba(var(--amb1), 0.80), rgba(var(--amb1), 0) 72%),
      radial-gradient(ellipse 900px 1300px at 600px 1020px, rgba(var(--amb2), 0.70), rgba(var(--amb2), 0) 75%);
  }
  #glow { position: absolute; inset: 0; opacity: 0.05; background: radial-gradient(ellipse 520px 380px at 600px 940px, rgba(var(--accent-rgb), 1), rgba(var(--accent-rgb), 0) 70%); }
  .bokeh { position: absolute; border-radius: 50%; }
  #fg { position: absolute; inset: 0; transform-origin: 540px 880px; }
  #row { position: absolute; left: 540px; top: 880px; display: flex; align-items: flex-start; }
  .mask { overflow: hidden; }
  #num { font-family: "MG Display", sans-serif; font-weight: 600; font-size: 204px; line-height: 1; letter-spacing: -0.035em; color: var(--ink); }
  #mNum { padding: 0 6px; }
  #lineWrap { margin: 0 46px; }
  #line { width: 3px; height: 150px; border-radius: 2px; background: var(--accent); transform-origin: 50% 50%;
          box-shadow: 0 0 2px rgba(var(--accent-rgb), 0.9), 0 0 16px rgba(var(--accent-rgb), 0.45); }
  #titleBlock { display: flex; flex-direction: column; align-items: flex-start; }
  #kicker { font-family: "MG Inter", sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3; letter-spacing: 0.34em; color: rgba(255, 255, 255, 0.62); }
  #title { font-family: "MG Display", sans-serif; font-weight: 600; font-size: 80px; line-height: 1.08; letter-spacing: 0.03em; color: var(--ink); white-space: nowrap; }
  #mKicker { margin-bottom: 6px; }
  em { font-style: normal; color: var(--accent); }
  .base { display: inline-block; width: 0; height: 0; vertical-align: baseline; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%); }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bg"><div id="ambient"></div><div id="glow"></div><div id="bokeh"></div></div>
    <div id="fg">
      <div id="row">
        <div class="exit" id="xNum"><div class="mask" id="mNum"><div id="num"></div></div></div>
        <div class="exit" id="lineWrap"><div id="line"></div></div>
        <div id="titleBlock">
          <div class="exit" id="xKicker"><div class="mask" id="mKicker"><div id="kicker"></div></div></div>
          <div class="exit" id="xTitle"><div class="mask" id="mTitle"><div id="title"></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="black"></div>
</div>
<script src="config.js"></script>
<script>
(async function () {
  const C = window.CONFIG;
  const FPS = C.fps || 30, TAU = Math.PI * 2;
  const warnings = [];
  const $ = id => document.getElementById(id);
  const hex = h => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const pal = Object.assign({ bg: "#0B111E", accent: "#4CC9F0" }, C.palette || {});
  const root = document.documentElement.style;
  const tone = k => hex(pal.bg).map(v => Math.min(255, Math.round(v * k))).join(", ");
  root.setProperty("--bg", pal.bg); root.setProperty("--accent", pal.accent);
  root.setProperty("--accent-rgb", hex(pal.accent).join(", "));
  root.setProperty("--amb1", tone(2.75)); root.setProperty("--amb2", tone(1.55));
  const ACC = hex(pal.accent).join(",");

  const clamp01 = x => Math.min(1, Math.max(0, x));
  const easeOutQuart = x => 1 - Math.pow(1 - x, 4);
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic = x => x * x * x;
  const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const prog = (t, f0, len) => clamp01((t * FPS - f0) / len);
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const fmt = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const words = s => s.replace(/\*/g, "").trim().split(/\s+/).filter(Boolean).length;

  await Promise.all([document.fonts.load('600 204px "MG Display"'), document.fonts.load('500 32px "MG Inter"')]);
  $("num").innerHTML = fmt(C.numero || "01") + '<span class="base" id="bNum"></span>';
  $("kicker").innerHTML = fmt(C.antetitulo || "");
  $("title").innerHTML = fmt(C.titulo || "") + '<span class="base" id="bTitle"></span>';
  if (!C.antetitulo) $("xKicker").style.display = "none";

  // Línea de tiempo (fotogramas): entrada escalonada cada 3 f, permanencia según tiempo de lectura
  const T = { num: 21, line: 24, kicker: 27, title: 30 };
  T.hit = T.num + 9;                                       // el número frena visualmente 9 f después de empezar
  T.settled = T.title + 12;
  const read = Math.ceil((words(`${C.antetitulo || ""} ${C.titulo || ""}`) / 3 + 1) * FPS);
  T.exit = T.settled + Math.max(read, C.permanenciaMin ? C.permanenciaMin * FPS : 82);
  T.fade = T.exit + 14;
  T.end = T.fade + 12;

  // Alineación tipográfica: la línea base del título coincide con la del número
  function align() {
    const moved = [$("world"), $("fg"), $("num"), $("kicker"), $("title"), $("row")];
    const saved = moved.map(n => n.style.transform);
    moved.forEach(n => (n.style.transform = "none"));
    $("titleBlock").style.marginTop = "0px"; $("lineWrap").style.marginTop = "0px";
    const cs = getComputedStyle($("num"));
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const asc = ctx.measureText($("num").textContent).actualBoundingBoxAscent;
    const rowTop = $("row").getBoundingClientRect().top;
    const numBase = $("bNum").getBoundingClientRect().top - rowTop;
    const titleBase = $("bTitle").getBoundingClientRect().top - rowTop;
    $("titleBlock").style.marginTop = (numBase - titleBase) + "px";
    $("line").style.height = asc + "px";
    $("lineWrap").style.marginTop = (numBase - asc) + "px";
    moved.forEach((n, i) => (n.style.transform = saved[i]));
    $("row").style.transform = `translate(-50%, ${-(numBase - asc / 2)}px)`;
    return $("row").offsetWidth;
  }
  let w = align();
  if (w > 860) {                                           // título largo: reducir hasta caber con margen para el push-in
    const k = 860 / w;
    $("title").style.fontSize = (80 * k) + "px"; $("num").style.fontSize = (204 * k) + "px";
    w = align();
    if (k < 0.7) warnings.push("Título muy largo para la tarjeta: considera acortarlo.");
  }

  const BOKEH = [
    { x: 230, y: 470, r: 120, c: ACC, a: 0.050, ph: 0.3 }, { x: 990, y: 660, r: 72, c: "255,255,255", a: 0.035, ph: 1.9 },
    { x: 940, y: 1530, r: 160, c: ACC, a: 0.040, ph: 4.1 }, { x: 270, y: 1390, r: 64, c: "255,255,255", a: 0.030, ph: 2.7 },
    { x: 710, y: 330, r: 48, c: ACC, a: 0.040, ph: 5.2 }, { x: 480, y: 1720, r: 96, c: "255,255,255", a: 0.025, ph: 0.9 },
  ];
  const bokehEls = BOKEH.map(b => {
    const el = document.createElement("div");
    el.className = "bokeh"; el.style.width = el.style.height = (b.r * 2) + "px";
    el.style.background = `radial-gradient(circle, rgba(${b.c},${b.a}) 0%, rgba(${b.c},${b.a * 0.85}) 48%, rgba(${b.c},0) 72%)`;
    $("bokeh").appendChild(el); return el;
  });
  function handheld(t) {
    const x = 0.6 * Math.sin(TAU * 0.53 * t + 1.3) + 0.3 * Math.sin(TAU * 0.97 * t + 0.4) + 0.1 * Math.sin(TAU * 1.71 * t + 2.1);
    const y = 0.6 * Math.sin(TAU * 0.47 * t + 0.2) + 0.3 * Math.sin(TAU * 0.89 * t + 2.6) + 0.1 * Math.sin(TAU * 1.83 * t + 1.1);
    const r = 0.6 * Math.sin(TAU * 0.41 * t + 0.9) + 0.4 * Math.sin(TAU * 0.77 * t + 1.7);
    return { x: x * 5, y: y * 5, r: r * 0.22 };
  }
  function reveal(node, t, f0) {
    node.style.transform = `translateY(${(1 - easeOutQuart(prog(t, f0, 12))) * 100}%)`;
    node.style.opacity = easeOutCubic(prog(t, f0, 10));
  }
  function exit(node, t, f0) {
    const p = easeInCubic(prog(t, f0, 8));
    node.style.transform = `translateY(${-30 * p}px)`; node.style.opacity = 1 - p;
  }

  window.render = function (t) {
    const f = t * FPS;
    const push = easeInOutSine(clamp01(f / T.end));
    const h = handheld(t);
    $("world").style.transform = `translate(${h.x * 0.4}px, ${h.y * 0.4}px) rotate(${h.r}deg) scale(${1 + 0.03 * push})`;
    $("fg").style.transform = `translate(${h.x * 0.6}px, ${h.y * 0.6}px) scale(${1 + 0.012 * push})`;
    BOKEH.forEach((b, i) => {
      const dy = -14 * Math.sin(TAU * 0.07 * t + b.ph), dx = 6 * Math.sin(TAU * 0.05 * t + b.ph * 1.7);
      bokehEls[i].style.transform = `translate(${b.x - b.r + dx}px, ${b.y - b.r + dy}px)`;
    });
    $("black").style.opacity = Math.max(1 - easeOutCubic(prog(t, 0, 12)), easeInOutSine(prog(t, T.fade, 11)));
    reveal($("num"), t, T.num);
    const pl = prog(t, T.line, 10);
    $("line").style.transform = `scaleY(${easeOutQuart(pl)})`;
    $("line").style.opacity = clamp01(pl * 3);
    reveal($("kicker"), t, T.kicker);
    reveal($("title"), t, T.title);
    let g = 0.05;
    if (f >= T.hit - 2) g += 0.06 * clamp01((f - T.hit + 2) / 2) * Math.exp(-Math.max(0, f - T.hit) / (0.55 * FPS));
    $("glow").style.opacity = g;
    exit($("xTitle"), t, T.exit);
    exit($("xKicker"), t, T.exit + 2);
    const pxl = easeInCubic(prog(t, T.exit + 4, 8));
    $("lineWrap").style.transform = `scaleY(${1 - pxl})`; $("lineWrap").style.opacity = 1 - pxl;
    exit($("xNum"), t, T.exit + 6);
  };

  window.COMP = {
    fps: FPS, frames: T.end, timeline: T, warnings, warmup: [],
    cues: [
      { f: T.hit, type: "riser_corto" }, { f: T.hit, type: "hit_grave" },
      { f: T.num, type: "whoosh" }, { f: T.exit + 10, type: "whoosh_suave" },
    ],
    moving: () => [$("num"), $("line"), $("kicker"), $("title"), $("xNum"), $("xTitle"), $("xKicker")],
    ready: true,
  };
  window.render(0);
})().catch(err => { window.COMP = { error: String(err && err.stack || err) }; });
</script>
</body>
</html>
