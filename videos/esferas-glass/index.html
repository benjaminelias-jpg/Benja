<!DOCTYPE html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=720, height=1280">
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #fondo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!--
      Tiempos (segundos, tiempo global):
        - las esferas entran en el data-start de #orbs: 1 → +0,5 s → 2 → +0,5 s → 3
        - salen 5,0 s después (3), 5,2 s (2) y 5,4 s (1)
      Para retimear: mover data-start de #orbs.
    -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.333" data-width="720" data-height="1280">
      <!-- Video original de fondo, con su audio intacto (sin SFX agregados) -->
      <video id="fondo" class="clip" src="assets/video/fragmento-apra.mp4" playsinline data-has-audio="true" data-start="0" data-duration="7.333" data-track-index="0" data-volume="1"></video>

      <!-- Esferas de vidrio (subcomposición) -->
      <div id="orbs" data-composition-id="orbs" data-composition-src="compositions/orbs.html" data-start="1" data-duration="5.8" data-track-index="1" data-width="720" data-height="1280"></div>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
