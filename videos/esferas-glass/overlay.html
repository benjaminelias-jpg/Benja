<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* Las esferas están diseñadas a 720x1280: se escalan 1,5x a 1080x1920 */
      #scaler {
        position: absolute;
        left: 0;
        top: 0;
        width: 720px;
        height: 1280px;
        transform: scale(1.5);
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <!--
      Overlay con fondo transparente (para render MOV/WebM con alpha).
      Las esferas entran en t=0 (1 → 0,5 s → 2 → 1,0 s → 3) y salen en 5,0 / 5,2 / 5,4 s.
      Sin video detrás no hay refracción: el vidrio queda con aro, brillos, sombreado y sombra.
    -->
    <div id="root" data-composition-id="overlay" data-start="0" data-duration="5.8" data-width="1080" data-height="1920">
      <div id="scaler">
        <div id="orbs" data-composition-id="orbs" data-composition-src="compositions/orbs.html" data-start="0" data-duration="5.8" data-track-index="0" data-width="720" data-height="1280"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["overlay"] = tl;
    </script>
  </body>
</html>
