<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>La clave está en los detalles</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter Display";
        src: url("assets/fonts/InterDisplay-SemiBold.otf") format("opentype");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }

      :root {
        --paper: #f2efe9;
        --ink: #131313;
        --gold: #b87e23;
        --fs-a: 128px;
        --fs-b: 132px;
        --key-w: 860px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #scene {
        position: absolute;
        inset: 0;
      }

      /* Flat warm paper: no gradient, so nothing bands after compression. */
      #bg {
        position: absolute;
        inset: 0;
        background: var(--paper);
      }

      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 540px 880px;
      }

      /* Two depth layers. A: "La clave" + the key (centered at y = 880 while it is the subject).
         B: "está en los detalles." (centered at y = 1060), the foreground once it arrives. */
      .layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #layerA {
        padding-bottom: 160px;
      }

      #layerB {
        padding-top: 200px;
      }

      .group {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Inter Display", sans-serif;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.035em;
        color: var(--ink);
        font-kerning: normal;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      #groupA {
        font-size: var(--fs-a);
      }

      #groupB {
        font-size: var(--fs-b);
      }

      .row {
        display: block;
        text-align: center;
      }

      .mask {
        display: block;
        overflow: hidden;
      }

      /* "La clave" rises from behind the key: its mask reaches down to the shaft (--e1, from layout). */
      #mask1 {
        padding: 0.15em 0.3em var(--e1, 0px);
        margin: -0.15em -0.3em calc(-1 * var(--e1, 0px));
      }

      .txt {
        display: block;
        white-space: nowrap;
      }

      .gold {
        color: var(--gold);
      }

      #keySlot {
        position: relative;
        z-index: 2; /* the key lies on top of the words */
        width: var(--key-w);
        aspect-ratio: 1985 / 581;
        margin-top: 34px;
      }

      /* Pre-blurred silhouette of the key (assets/img/golden-key-shadow.webp, 90 px padding):
         tight and close, because the key rests on the paper. */
      #shadow {
        position: absolute;
        left: -4.534%;
        top: -15.491%;
        width: 109.068%;
        height: 130.981%;
        opacity: 0;
      }

      #keyRig,
      #keyArt {
        position: absolute;
        inset: 0;
      }

      /* Directional motion blur for the swoosh (SVG filter, horizontal only). */
      #keyArt {
        isolation: isolate;
        filter: url(#motionBlur);
      }

      #keyImg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* A light flick across the metal as the key lands (masked by the key's own alpha). */
      #glint {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask-image: url("assets/img/golden-key.webp");
        mask-image: url("assets/img/golden-key.webp");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        mix-blend-mode: color-dodge;
      }

      #glintBand {
        position: absolute;
        top: -30%;
        left: 0;
        width: 13%;
        height: 160%;
        background: linear-gradient(
          90deg,
          rgba(255, 214, 140, 0) 0%,
          rgba(255, 214, 140, 0.12) 30%,
          rgba(255, 226, 170, 0.62) 50%,
          rgba(255, 214, 140, 0.12) 70%,
          rgba(255, 214, 140, 0) 100%
        );
      }

      #svgDefs {
        position: absolute;
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.5"
      data-width="1080"
      data-height="1920"
      data-fps="60"
    >
      <svg id="svgDefs" aria-hidden="true">
        <filter id="motionBlur" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
          <feGaussianBlur id="motionBlurStd" in="SourceGraphic" stdDeviation="0 0" />
        </filter>
      </svg>

      <div id="scene">
        <div id="bg"></div>
        <div id="camera">
          <div class="layer" id="layerA">
            <div class="group" id="groupA">
              <div class="row" id="row1">
                <div class="mask" id="mask1">
                  <span class="txt" id="t1" data-layout-allow-overflow="true" data-layout-allow-occlusion="true">La clave</span>
                </div>
              </div>

              <div id="keySlot" data-layout-allow-overflow="true" data-layout-allow-occlusion="true">
                <img id="shadow" src="assets/img/golden-key-shadow.webp" alt="" />
                <div id="keyRig">
                  <div id="keyArt">
                    <img id="keyImg" src="assets/img/golden-key.webp" alt="Llave dorada" />
                    <div id="glint"><div id="glintBand"></div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="layer" id="layerB">
            <div class="group" id="groupB">
              <div class="row"><span class="txt" id="t2">está en los</span></div>
              <div class="row"><span class="txt" id="t3">detalles<span class="gold">.</span></span></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Procedural sound (audio/build_audio.py + procedural-sfx). -->
      <audio
        id="sound"
        src="assets/audio/sound.wav"
        data-start="0"
        data-duration="5.5"
        data-track-index="1"
        data-volume="1"
      ></audio>
    </div>

    <!-- Single source of truth for timing: the sound is generated from it. -->
    <script type="application/json" id="timing">
      {
        "keyIn": 0.15,
        "land": 0.5,
        "glint": 0.6,
        "rise1": 0.72,
        "shift": 2.05,
        "settleB": 2.75,
        "end": 5.5
      }
    </script>

    <script>
      (async () => {
        const T = JSON.parse(document.getElementById("timing").textContent);
        const $ = (id) => document.getElementById(id);

        const FS = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs-a"));
        await document.fonts.load(`600 ${FS}px "Inter Display"`, "La clave está en los detalles.");
        await document.fonts.ready;
        await Promise.all(
          [$("keyImg"), $("shadow")].map((img) => (img.complete ? null : img.decode().catch(() => null))),
        );

        const row1 = $("row1");
        const slot = $("keySlot");
        const t1 = $("t1");

        // The shaft's center line, measured from the key's alpha (50.86% of the image height).
        const SHAFT = slot.offsetTop + slot.offsetHeight * 0.5086;
        const e1 = SHAFT - (row1.offsetTop + row1.offsetHeight);
        $("mask1").style.setProperty("--e1", `${e1}px`);
        const t1From = t1.offsetHeight + e1 + 0.25 * FS;

        gsap.set("#shadow", { x: 6, y: 12, transformOrigin: "50% 50%" });
        gsap.set("#glintBand", { xPercent: -120, skewX: -18 });
        gsap.set("#groupA", { transformOrigin: "50% 50%" });
        gsap.set("#groupB", { transformOrigin: "50% 50%" });

        const tl = gsap.timeline({ paused: true });

        // Slow push-in for the whole piece: the camera keeps moving forward.
        tl.fromTo("#camera", { scale: 1 }, { scale: 1.03, duration: T.end, ease: "sine.inOut" }, 0);

        // 1 — Swoosh: the key slides in from the left with motion blur and comes to rest on the paper.
        tl.fromTo(
          "#keyRig",
          { autoAlpha: 0, x: -780, y: 26, rotation: -20, scale: 1.04 },
          { autoAlpha: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.6, ease: "expo.out" },
          T.keyIn,
        );
        tl.fromTo(
          "#motionBlurStd",
          { attr: { stdDeviation: "46 0" } },
          { attr: { stdDeviation: "0 0" }, duration: 0.42, ease: "power2.out" },
          T.keyIn,
        );
        tl.fromTo(
          "#shadow",
          { opacity: 0, scale: 1.06 },
          { opacity: 0.32, scale: 1, duration: 0.35, ease: "power2.out" },
          T.land - 0.15,
        );

        // A quick flick of light across the metal as it lands.
        tl.fromTo(
          "#glintBand",
          { xPercent: -120 },
          { xPercent: 900, duration: 0.6, ease: "power2.inOut", immediateRender: false },
          T.glint,
        );

        // 2 — "La clave" rises from behind the key.
        tl.fromTo(t1, { y: t1From }, { y: 0, duration: 0.85, ease: "expo.out" }, T.rise1);

        // 3 — Handoff: the rest of the sentence swooshes in from the camera, and "La clave" + the key
        //     step back (smaller, higher, duller, slightly out of focus) to give it priority.
        tl.fromTo(
          "#groupA",
          { scale: 1, y: 0 },
          { scale: 0.62, y: -230, duration: 0.85, ease: "power2.inOut" },
          T.shift,
        );
        tl.fromTo(
          "#groupA",
          { opacity: 1, filter: "brightness(1) saturate(1) blur(0px)" },
          { opacity: 0.58, filter: "brightness(0.95) saturate(0.7) blur(1.4px)", duration: 0.85, ease: "power2.inOut" },
          T.shift,
        );
        tl.fromTo(
          "#groupB",
          { autoAlpha: 0, scale: 1.28, y: 150, filter: "blur(18px)" },
          { autoAlpha: 1, scale: 1, y: 0, filter: "blur(0px)", duration: T.settleB - T.shift + 0.1, ease: "expo.out" },
          T.shift + 0.14,
        );

        window.__timelines["main"] = tl;
        tl.seek(0);
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      })();
    </script>
  </body>
</html>
