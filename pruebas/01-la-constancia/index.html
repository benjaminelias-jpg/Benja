<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>01 · La constancia</title>
<style>
  :root {
    --bg: #0B111E;
    --ink: #FFFFFF;
    --accent: #4CC9F0;
  }
  html, body { margin: 0; padding: 0; background: #000; }

  /* Lienzo 9:16 */
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

  /* Cámara (nulo): push-in + cámara en mano. Origen en el centro del grupo. */
  #world { position: absolute; inset: 0; transform-origin: 540px 880px; }

  /* Fondo sobredimensionado para que la cámara en mano nunca muestre bordes */
  #bg { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; background: var(--bg); }
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 640px 560px at 600px 940px, rgba(30, 48, 82, 0.80), rgba(11, 17, 30, 0) 72%),
      radial-gradient(ellipse 900px 1300px at 600px 1020px, rgba(17, 27, 46, 0.70), rgba(11, 17, 30, 0) 75%);
  }
  #glow {
    position: absolute; inset: 0; opacity: 0.05;
    background: radial-gradient(ellipse 520px 380px at 600px 940px, rgba(76, 201, 240, 1), rgba(76, 201, 240, 0) 70%);
  }
  .bokeh { position: absolute; border-radius: 50%; }

  /* Grupo en primer plano (paralaje respecto al fondo) */
  #fg { position: absolute; inset: 0; transform-origin: 540px 880px; }
  #row {
    position: absolute; left: 540px; top: 880px;
    transform: translate(-50%, -50%);
    display: flex; align-items: flex-start;
  }

  .mask { overflow: hidden; }
  .exit { will-change: transform, opacity; }

  #num {
    font-family: "Inter Display", "Inter", sans-serif; font-weight: 600;
    font-size: 204px; line-height: 1; letter-spacing: -0.035em;
    color: var(--ink);
  }
  #mNum { padding: 0 6px; }

  #lineWrap { margin: 0 46px; }
  #line {
    width: 3px; height: 150px; border-radius: 2px;
    background: var(--accent);
    box-shadow: 0 0 2px rgba(76, 201, 240, 0.9), 0 0 16px rgba(76, 201, 240, 0.45);
    transform-origin: 50% 50%;
  }

  #titleBlock { display: flex; flex-direction: column; align-items: flex-start; }
  #kicker {
    font-family: "Inter", sans-serif; font-weight: 500;
    font-size: 32px; line-height: 1.3; letter-spacing: 0.34em;
    color: rgba(255, 255, 255, 0.62);
  }
  #title {
    font-family: "Inter Display", "Inter", sans-serif; font-weight: 600;
    font-size: 80px; line-height: 1.08; letter-spacing: 0.03em;
    color: var(--ink);
  }
  #mKicker { margin-bottom: 6px; }
  .base { display: inline-block; width: 0; height: 0; vertical-align: baseline; }

  /* Viñeta: propiedad de la "lente", no se mueve con la cámara */
  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.62) 100%);
  }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bg">
      <div id="ambient"></div>
      <div id="glow"></div>
      <div id="bokeh"></div>
    </div>
    <div id="fg">
      <div id="row">
        <div class="exit" id="xNum"><div class="mask" id="mNum"><div id="num">01<span class="base" id="bNum"></span></div></div></div>
        <div class="exit" id="lineWrap"><div id="line"></div></div>
        <div id="titleBlock">
          <div class="exit" id="xKicker"><div class="mask" id="mKicker"><div id="kicker">LA</div></div></div>
          <div class="exit" id="xTitle"><div class="mask" id="mTitle"><div id="title">CONSTANCIA<span class="base" id="bTitle"></span></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <div id="vignette"></div>
  <div id="black"></div>
</div>

<script>
  const FPS = 30;
  const TAU = Math.PI * 2;

  // Curvas (equivalencias en references/css-gsap-motion.md)
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const easeOutQuart = x => 1 - Math.pow(1 - x, 4);     // cubic-bezier(0.25, 1, 0.5, 1)
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic = x => x * x * x;                   // salidas
  const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const prog = (t, startF, durF) => clamp01((t * FPS - startF) / durF);

  // Bokeh de fondo: profundidad de campo (atmósfera, no cuenta como elemento)
  // Coordenadas en el espacio del fondo (+60 px respecto al lienzo)
  const BOKEH = [
    { x: 230, y: 470,  r: 120, c: "76,201,240",  a: 0.050, ph: 0.3 },
    { x: 990, y: 660,  r: 72,  c: "255,255,255", a: 0.035, ph: 1.9 },
    { x: 940, y: 1530, r: 160, c: "76,201,240",  a: 0.040, ph: 4.1 },
    { x: 270, y: 1390, r: 64,  c: "255,255,255", a: 0.030, ph: 2.7 },
    { x: 710, y: 330,  r: 48,  c: "76,201,240",  a: 0.040, ph: 5.2 },
    { x: 480, y: 1720, r: 96,  c: "255,255,255", a: 0.025, ph: 0.9 },
  ];
  const bokehRoot = document.getElementById("bokeh");
  const bokehEls = BOKEH.map(b => {
    const el = document.createElement("div");
    el.className = "bokeh";
    el.style.width = el.style.height = (b.r * 2) + "px";
    el.style.background = `radial-gradient(circle, rgba(${b.c},${b.a}) 0%, rgba(${b.c},${b.a * 0.85}) 48%, rgba(${b.c},0) 72%)`;
    bokehRoot.appendChild(el);
    return el;
  });

  // Cámara en mano: suma de senos de baja frecuencia (≈0,4–1,8 Hz), amplitud ≈5 px y ±0,22°
  function handheld(t) {
    const x = 0.6 * Math.sin(TAU * 0.53 * t + 1.3) + 0.3 * Math.sin(TAU * 0.97 * t + 0.4) + 0.1 * Math.sin(TAU * 1.71 * t + 2.1);
    const y = 0.6 * Math.sin(TAU * 0.47 * t + 0.2) + 0.3 * Math.sin(TAU * 0.89 * t + 2.6) + 0.1 * Math.sin(TAU * 1.83 * t + 1.1);
    const r = 0.6 * Math.sin(TAU * 0.41 * t + 0.9) + 0.4 * Math.sin(TAU * 0.77 * t + 1.7);
    return { x: x * 5, y: y * 5, r: r * 0.22 };
  }

  const $ = id => document.getElementById(id);
  const el = {
    world: $("world"), fg: $("fg"), glow: $("glow"), black: $("black"),
    num: $("num"), line: $("line"), kicker: $("kicker"), title: $("title"),
    xNum: $("xNum"), xLine: $("lineWrap"), xKicker: $("xKicker"), xTitle: $("xTitle"),
  };

  // Revelado con máscara: el texto sube desde debajo de una línea invisible
  function reveal(node, t, startF) {
    const p = prog(t, startF, 12);                       // 0,4 s
    node.style.transform = `translateY(${(1 - easeOutQuart(p)) * 100}%)`;
    node.style.opacity = easeOutCubic(prog(t, startF, 10)); // 10 f de opacidad
  }

  // Salida: sube 30 px y se desvanece en 8 f con ease-in
  function exit(node, t, startF) {
    const p = easeInCubic(prog(t, startF, 8));
    node.style.transform = `translateY(${-30 * p}px)`;
    node.style.opacity = 1 - p;
  }

  window.render = function (t) {
    // Cámara: push-in del 100 % al 103 % en toda la pieza, con paralaje (+1,2 % extra en primer plano)
    const push = easeInOutSine(clamp01(t / 5));
    const h = handheld(t);
    el.world.style.transform =
      `translate(${h.x * 0.4}px, ${h.y * 0.4}px) rotate(${h.r}deg) scale(${1 + 0.03 * push})`;
    el.fg.style.transform =
      `translate(${h.x * 0.6}px, ${h.y * 0.6}px) scale(${1 + 0.012 * push})`;

    // Bokeh: deriva lenta y orgánica (senoidal, nunca a velocidad constante)
    BOKEH.forEach((b, i) => {
      const dy = -14 * Math.sin(TAU * 0.07 * t + b.ph);
      const dx = 6 * Math.sin(TAU * 0.05 * t + b.ph * 1.7);
      bokehEls[i].style.transform = `translate(${b.x - b.r + dx}px, ${b.y - b.r + dy}px)`;
    });

    // Fundido desde negro (f0–f12) y a negro (f138–f149)
    el.black.style.opacity =
      Math.max(1 - easeOutCubic(prog(t, 0, 12)), easeInOutSine(prog(t, 138, 11)));

    // Entradas escalonadas cada 3 f: número → línea → "LA" → "CONSTANCIA"
    reveal(el.num, t, 21);
    const pl = prog(t, 24, 10);
    el.line.style.transform = `scaleY(${easeOutQuart(pl)})`;
    el.line.style.opacity = clamp01(pl * 3);
    reveal(el.kicker, t, 27);
    reveal(el.title, t, 30);

    // Respuesta de luz al hit (f30): el halo ambiental sube y decae
    const tHit = 1.0;
    let g = 0.05;
    if (t >= tHit - 2 / FPS) {
      const rise = clamp01((t - (tHit - 2 / FPS)) / (2 / FPS));
      g += 0.06 * rise * Math.exp(-Math.max(0, t - tHit) / 0.55);
    }
    el.glow.style.opacity = g;

    // Salidas en orden inverso, escalonadas 2 f
    exit(el.xTitle, t, 124);
    exit(el.xKicker, t, 126);
    const pxl = easeInCubic(prog(t, 128, 8));
    el.xLine.style.transform = `scaleY(${1 - pxl})`;
    el.xLine.style.opacity = 1 - pxl;
    exit(el.xNum, t, 130);
  };

  // Alineación tipográfica (se mide una vez, antes de animar):
  // la línea base de "CONSTANCIA" coincide con la del "01" y la línea cian
  // va exactamente de la altura de las cifras a la línea base.
  function align() {
    // Medir en estado neutro: sin transformaciones de cámara ni de revelado
    const moved = [el.world, el.fg, el.num, el.kicker, el.title, $("row")];
    const saved = moved.map(n => n.style.transform);
    moved.forEach(n => (n.style.transform = "none"));
    $("titleBlock").style.marginTop = "0px";
    el.xLine.style.marginTop = "0px";

    const cs = getComputedStyle(el.num);
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const digitAscent = ctx.measureText("01").actualBoundingBoxAscent;
    const rowTop = $("row").getBoundingClientRect().top;
    const numBase = $("bNum").getBoundingClientRect().top - rowTop;
    const titleBase = $("bTitle").getBoundingClientRect().top - rowTop;
    $("titleBlock").style.marginTop = (numBase - titleBase) + "px";
    el.line.style.height = digitAscent + "px";
    el.xLine.style.marginTop = (numBase - digitAscent) + "px";

    moved.forEach((n, i) => (n.style.transform = saved[i]));
    // Centrar el grupo en horizontal por su caja y en vertical por la altura de las cifras
    const capCenter = numBase - digitAscent / 2;
    $("row").style.transform = `translate(-50%, ${-capCenter}px)`;
    const r = $("row").getBoundingClientRect();
    window.__layout = { width: r.width, left: r.left, right: r.right, digitAscent, numBase, capCenter };
  }
  align();
  window.render(0);
</script>
</body>
</html>
