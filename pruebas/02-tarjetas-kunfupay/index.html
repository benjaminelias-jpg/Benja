<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Así cobras con Kunfupay</title>
<style>
  :root { --bg: #0B111E; --ink: #FFFFFF; --accent: #4CC9F0; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

  /* Cámara (nulo): push-in, acercamiento al foco y cámara en mano */
  #world { position: absolute; inset: 0; transform-origin: 540px 860px; }

  /* Atmósfera */
  #bg { position: absolute; left: -80px; top: -80px; width: 1240px; height: 2080px; background: var(--bg); }
  #ambient {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 680px 600px at 620px 940px, rgba(30, 48, 82, 0.80), rgba(11, 17, 30, 0) 72%),
      radial-gradient(ellipse 900px 1300px at 620px 1000px, rgba(17, 27, 46, 0.70), rgba(11, 17, 30, 0) 75%);
  }
  #glow {
    position: absolute; inset: 0; opacity: 0.05;
    background: radial-gradient(ellipse 560px 460px at 620px 880px, rgba(76, 201, 240, 1), rgba(76, 201, 240, 0) 70%);
  }
  .bokeh { position: absolute; border-radius: 50%; }

  /* Escena 3D: las tarjetas que no están en foco se alejan en Z */
  #scene { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 540px 860px; }

  /* Intro */
  #intro { position: absolute; inset: 0; z-index: 3000; }
  #introBlock { position: absolute; left: 540px; top: 860px; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
  .mask { overflow: hidden; }
  #kicker {
    font-family: "Inter", sans-serif; font-weight: 500; font-size: 32px; line-height: 1.3;
    letter-spacing: 0.34em; padding-left: 0.34em; color: rgba(255, 255, 255, 0.62);
  }
  .tline {
    font-family: "Inter Display", "Inter", sans-serif; font-weight: 600; font-size: 96px;
    line-height: 1.06; letter-spacing: 0.01em; color: var(--ink);
  }
  #mKicker { margin-bottom: 18px; }
  em { font-style: normal; color: var(--accent); }

  /* Tarjetas */
  .card {
    position: absolute; left: 130px; width: 820px; height: 200px; border-radius: 28px;
    background: linear-gradient(135deg, rgba(31, 45, 72, 0.95), rgba(15, 22, 38, 0.95));
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    perspective: 1400px;
  }
  .content { position: absolute; left: 44px; top: 0; height: 200px; display: flex; align-items: center; }
  .num {
    font-family: "Inter Display", "Inter", sans-serif; font-weight: 600; font-size: 72px;
    letter-spacing: -0.03em; line-height: 1; color: var(--ink);
  }
  .cline {
    width: 3px; height: 64px; margin: 0 28px; border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 2px rgba(76, 201, 240, 0.9), 0 0 12px rgba(76, 201, 240, 0.45);
  }
  .ctitle {
    font-family: "Inter Display", "Inter", sans-serif; font-weight: 600; font-size: 48px;
    letter-spacing: 0.02em; color: var(--ink); white-space: nowrap;
  }

  /* Objeto real: vive dentro de su tarjeta y sale de ella */
  .obj { position: absolute; }
  .obj img { display: block; width: 100%; height: 100%; }
  .obj .sweep {
    position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0;
    background: linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 58%);
    background-size: 300% 100%;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
  }

  /* Frases */
  .cap { position: absolute; left: 0; width: 1080px; top: 1170px; transform: translateY(-50%); text-align: center; z-index: 4000; }
  .cap .mask { display: inline-block; padding: 0 12px 0.1em; }
  .cap .txt {
    display: inline-block; font-family: "Inter Display", "Inter", sans-serif; font-weight: 600;
    font-size: 66px; letter-spacing: 0.005em; color: var(--ink); white-space: nowrap;
  }

  #vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 80% 64% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.62) 100%);
  }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="bg">
      <div id="ambient"></div>
      <div id="glow"></div>
      <div id="bokeh"></div>
    </div>
    <div id="scene">
      <div id="intro">
        <div id="introBlock">
          <div class="mask" id="mKicker"><div id="kicker">VENDES CURSOS ONLINE</div></div>
          <div class="mask"><div class="tline" id="tl1">ASÍ COBRAS</div></div>
          <div class="mask"><div class="tline" id="tl2">CON <em>KUNFUPAY</em></div></div>
        </div>
      </div>
      <!-- tarjetas: se rellenan desde el script -->
    </div>
    <div class="cap"><div class="mask"><div class="txt" id="cap0">Se la hacemos <em>nosotros.</em></div></div></div>
    <div class="cap"><div class="mask"><div class="txt" id="cap1">Te olvidas de su <em>IVA.</em></div></div></div>
    <div class="cap"><div class="mask"><div class="txt" id="cap2">A <em>tu nombre.</em></div></div></div>
  </div>
  <div id="vignette"></div>
  <div id="black"></div>
</div>

<script>
  const FPS = 30, TAU = Math.PI * 2;
  const DURATION_F = 650;               // 21,67 s

  // ---------- curvas ----------
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const lin = x => x;
  const outQuart = x => 1 - Math.pow(1 - x, 4);        // cubic-bezier(0.25, 1, 0.5, 1)
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const inCubic = x => x * x * x;
  const inOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const inOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const prog = (t, f0, len) => clamp01((t * FPS - f0) / len);

  // Interpolación por keyframes: [[fotograma, valor, curva de llegada], ...]
  function mix(a, b, e) {
    if (typeof a === "number") return a + (b - a) * e;
    const o = {}; for (const k in a) o[k] = a[k] + (b[k] - a[k]) * e; return o;
  }
  function kf(t, keys) {
    const f = t * FPS;
    if (f <= keys[0][0]) return keys[0][1];
    for (let k = 1; k < keys.length; k++) {
      if (f <= keys[k][0]) {
        const [f0, v0] = keys[k - 1], [f1, v1, ease] = keys[k];
        return mix(v0, v1, (ease || lin)(f1 === f0 ? 1 : (f - f0) / (f1 - f0)));
      }
    }
    return keys[keys.length - 1][1];
  }

  // ---------- estados de las tarjetas ----------
  const LIST_Y = [660, 880, 1100];
  const LIST = i => ({ y: LIST_Y[i], s: 1, z: 0, b: 0, o: 1 });
  const ENTER = i => ({ y: LIST_Y[i] + 160, s: 1, z: -200, b: 4, o: 0 });
  const CENTER = { y: 880, s: 1.15, z: 0, b: 0, o: 1 };
  const HEADER = { y: 400, s: 0.8, z: 0, b: 0, o: 1 };
  const REC = (j, i) => ({ y: 880 + (j - i) * 260, s: 1, z: -520, b: 9, o: 0.28 });  // se aleja

  const CARD_KEYS = [
    [[0, ENTER(0)], [116, ENTER(0)], [132, LIST(0), outQuart], [160, LIST(0)], [178, CENTER, outQuart],
     [190, CENTER], [210, HEADER, inOutCubic], [288, HEADER], [308, REC(0, 1), inOutCubic],
     [430, REC(0, 1)], [450, REC(0, 2), inOutCubic], [562, REC(0, 2)], [584, LIST(0), outCubic]],
    [[0, ENTER(1)], [120, ENTER(1)], [136, LIST(1), outQuart], [160, LIST(1)], [180, REC(1, 0), outCubic],
     [292, REC(1, 0)], [310, CENTER, outQuart], [322, CENTER], [342, HEADER, inOutCubic],
     [430, HEADER], [450, REC(1, 2), inOutCubic], [562, REC(1, 2)], [584, LIST(1), outCubic]],
    [[0, ENTER(2)], [124, ENTER(2)], [140, LIST(2), outQuart], [160, LIST(2)], [180, REC(2, 0), outCubic],
     [288, REC(2, 0)], [308, REC(2, 1), inOutCubic], [434, REC(2, 1)], [452, CENTER, outQuart],
     [464, CENTER], [484, HEADER, inOutCubic], [562, HEADER], [582, LIST(2), inOutCubic]],
  ];

  // Objeto fuera de la tarjeta: 0 = en su hueco, 1 = protagonista en el centro
  const OUT_KEYS = [
    [[0, 0], [190, 0], [210, 1, outQuart], [288, 1], [304, 0, inOutCubic]],
    [[0, 0], [322, 0], [342, 1, outQuart], [430, 1], [446, 0, inOutCubic]],
    [[0, 0], [464, 0], [484, 1, outQuart], [562, 1], [580, 0, inOutCubic]],
  ];
  const LAND = [210, 342, 484];
  const HERO = { x: 540, y: 800 };
  const SLOT_X = 300;                   // centro del hueco del objeto respecto al centro de la tarjeta
  const OBJ = [
    { src: "assets/img/factura.png",     w: 430, h: 580, rot: -5,  thumb: 150 / 580, title: "LA FACTURA" },
    { src: "assets/img/calculadora.png", w: 430, h: 560, rot: 4,   thumb: 150 / 560, title: "CADA VENTA" },
    { src: "assets/img/llave.png",       w: 760, h: 306, rot: -12, thumb: 175 / 760, title: "TU CUENTA" },
  ];
  const CAPS = [{ in: 216, out: 288 }, { in: 348, out: 430 }, { in: 490, out: 562 }];
  const HITS = [[30, 0.06], [210, 0.035], [342, 0.035], [484, 0.035], [584, 0.06]];
  const RECAP_PULSE = [588, 592, 596];

  // ---------- construcción del DOM ----------
  const $ = id => document.getElementById(id);
  const scene = $("scene");
  const cards = OBJ.map((o, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.top = (LIST_Y[i] - 100) + "px";
    card.innerHTML = `
      <div class="content"><div class="num">0${i + 1}</div><div class="cline"></div><div class="ctitle">${o.title}</div></div>
      <div class="obj" style="width:${o.w}px;height:${o.h}px;left:${410 - o.w / 2}px;top:${100 - o.h / 2}px">
        <img src="${o.src}"><div class="sweep" style="-webkit-mask-image:url(${o.src});mask-image:url(${o.src})"></div>
      </div>`;
    scene.appendChild(card);
    return { el: card, content: card.querySelector(".content"), line: card.querySelector(".cline"),
             obj: card.querySelector(".obj"), img: card.querySelector("img"), sweep: card.querySelector(".sweep") };
  });
  // Centro del bloque de texto de cada tarjeta, para recentrarlo cuando el objeto sale
  let contentShift = [0, 0, 0];
  function measure() {
    contentShift = cards.map(c => 410 - (44 + c.content.offsetWidth / 2));
  }

  // Bokeh de fondo (coordenadas del fondo, +80 px respecto al lienzo)
  const BOKEH = [
    { x: 250, y: 470,  r: 120, c: "76,201,240",  a: 0.050, ph: 0.3 },
    { x: 1010, y: 660, r: 72,  c: "255,255,255", a: 0.035, ph: 1.9 },
    { x: 960, y: 1560, r: 160, c: "76,201,240",  a: 0.040, ph: 4.1 },
    { x: 290, y: 1420, r: 64,  c: "255,255,255", a: 0.030, ph: 2.7 },
    { x: 730, y: 330,  r: 48,  c: "76,201,240",  a: 0.040, ph: 5.2 },
    { x: 500, y: 1760, r: 96,  c: "255,255,255", a: 0.025, ph: 0.9 },
  ];
  const bokehEls = BOKEH.map(b => {
    const el = document.createElement("div");
    el.className = "bokeh";
    el.style.width = el.style.height = (b.r * 2) + "px";
    el.style.background = `radial-gradient(circle, rgba(${b.c},${b.a}) 0%, rgba(${b.c},${b.a * 0.85}) 48%, rgba(${b.c},0) 72%)`;
    $("bokeh").appendChild(el);
    return el;
  });

  function handheld(t) {
    const x = 0.6 * Math.sin(TAU * 0.53 * t + 1.3) + 0.3 * Math.sin(TAU * 0.97 * t + 0.4) + 0.1 * Math.sin(TAU * 1.71 * t + 2.1);
    const y = 0.6 * Math.sin(TAU * 0.47 * t + 0.2) + 0.3 * Math.sin(TAU * 0.89 * t + 2.6) + 0.1 * Math.sin(TAU * 1.83 * t + 1.1);
    const r = 0.6 * Math.sin(TAU * 0.41 * t + 0.9) + 0.4 * Math.sin(TAU * 0.77 * t + 1.7);
    return { x: x * 5, y: y * 5, r: r * 0.22 };
  }

  function reveal(node, t, f0) {
    node.style.transform = `translateY(${(1 - outQuart(prog(t, f0, 12))) * 100}%)`;
    node.style.opacity = outCubic(prog(t, f0, 10));
  }

  // ---------- render(t) ----------
  window.render = function (t) {
    const f = t * FPS;

    // Cámara: push-in de toda la pieza + acercamiento mientras hay una tarjeta en foco
    const push = inOutSine(clamp01(f / DURATION_F));
    const focus = kf(t, [[0, 0], [160, 0], [180, 1, inOutSine], [562, 1], [586, 0, inOutSine]]);
    const h = handheld(t);
    $("world").style.transform =
      `translate(${h.x * 0.5}px, ${h.y * 0.5}px) rotate(${h.r}deg) scale(${(1 + 0.035 * push) * (1 + 0.025 * focus)})`;
    $("scene").style.transform = `translate(${h.x * 0.5}px, ${h.y * 0.5}px)`;   // paralaje: el primer plano se mueve más

    BOKEH.forEach((b, i) => {
      const dy = -14 * Math.sin(TAU * 0.07 * t + b.ph), dx = 6 * Math.sin(TAU * 0.05 * t + b.ph * 1.7);
      bokehEls[i].style.transform = `translate(${b.x - b.r + dx}px, ${b.y - b.r + dy}px)`;
    });

    // Halo: responde a cada hit
    let g = 0.05;
    for (const [hf, amp] of HITS) {
      if (f >= hf - 2) g += amp * clamp01((f - hf + 2) / 2) * Math.exp(-Math.max(0, f - hf) / (0.55 * FPS));
    }
    $("glow").style.opacity = g;

    // Fundidos de negro
    $("black").style.opacity = Math.max(1 - outCubic(prog(t, 0, 12)), inOutSine(prog(t, 630, 19)));

    // Intro: revelado escalonado y salida hacia el fondo
    reveal($("kicker"), t, 15);
    reveal($("tl1"), t, 21);
    reveal($("tl2"), t, 24);
    const ie = inCubic(prog(t, 112, 12));
    $("intro").style.transform = `translateZ(${-420 * ie}px)`;
    $("intro").style.opacity = 1 - ie;
    $("intro").style.filter = ie > 0.001 ? `blur(${8 * ie}px)` : "none";
    $("intro").style.visibility = ie >= 1 ? "hidden" : "visible";

    // Mientras un objeto está fuera, las tarjetas del fondo se alejan todavía más
    const heroE = Math.max(...OUT_KEYS.map(k => kf(t, k)));

    // Tarjetas y objetos
    cards.forEach((c, i) => {
      const p = kf(t, CARD_KEYS[i]);
      const depth = clamp01(-p.z / 520);           // 0 en primer plano, 1 al fondo
      p.o *= 1 - 0.55 * heroE * depth;
      p.b += 5 * heroE * depth;
      c.el.style.transform = `translate3d(0, ${p.y - LIST_Y[i]}px, ${p.z}px) scale(${p.s})`;
      c.el.style.opacity = p.o;
      c.el.style.filter = p.b > 0.05 ? `blur(${p.b}px)` : "none";
      c.el.style.zIndex = Math.round(2000 + p.z * 2 + p.s * 100);
      c.el.style.visibility = p.o < 0.002 ? "hidden" : "visible";

      const o = OBJ[i];
      const e = kf(t, OUT_KEYS[i]);
      c.content.style.transform = `translateX(${contentShift[i] * e}px)`;

      // Posición absoluta del objeto: mezcla entre su hueco en la tarjeta y el centro
      const slotX = 540 + p.s * SLOT_X, slotY = p.y, slotS = p.s * o.thumb;
      const since = Math.max(0, f - LAND[i]) / FPS;
      const floatY = 6 * Math.sin(TAU * 0.28 * since);
      const idleS = 1 + 0.035 * clamp01(since / 2.6);
      const arc = -70 * Math.sin(Math.PI * e);
      const ax = slotX + (HERO.x - slotX) * e;
      const ay = slotY + (HERO.y + floatY * e - slotY) * e + arc;
      const as = slotS + (idleS - slotS) * e;
      const rx = (ax - 540) / p.s, ry = (ay - p.y) / p.s, rs = as / p.s;
      const rotZ = o.rot + 0.8 * Math.sin(TAU * 0.22 * since) * e;
      const rotY = 30 * Math.sin(Math.PI * e) * (1 - e) * 1.5;
      c.obj.style.transform = `translate(${rx}px, ${ry}px) rotateY(${rotY}deg) rotate(${rotZ}deg) scale(${rs})`;
      c.obj.style.zIndex = 5;
      const shadow = 10 + 40 * e;
      c.img.style.filter = `drop-shadow(0 ${shadow * 0.7}px ${shadow}px rgba(0,0,0,${0.35 + 0.25 * e}))` +
        (i === 1 ? ` drop-shadow(0 0 ${24 * e}px rgba(76,201,240,${0.22 * e}))` : "");

      // Brillo especular que recorre el objeto al aterrizar
      const sw = prog(t, LAND[i] + 2, 24);
      c.sweep.style.backgroundPosition = `${100 - 100 * inOutSine(sw)}% 0`;
      c.sweep.style.opacity = sw > 0 && sw < 1 ? 0.55 : 0;

      // Recap: la línea de acento de cada tarjeta se ilumina en secuencia
      const pulse = Math.exp(-Math.pow((f - RECAP_PULSE[i]) / 4.5, 2));
      c.line.style.transform = `scaleY(${1 + 0.18 * pulse})`;
      c.line.style.boxShadow = `0 0 2px rgba(76,201,240,0.9), 0 0 ${12 + 22 * pulse}px rgba(76,201,240,${0.45 + 0.4 * pulse})`;
    });

    // Frases: revelado con máscara y salida hacia arriba
    CAPS.forEach((cp, i) => {
      const node = $("cap" + i);
      const xe = inCubic(prog(t, cp.out, 8));
      const pin = prog(t, cp.in, 12);
      node.style.transform = `translateY(${(1 - outQuart(pin)) * 100}%) translateY(${-24 * xe}px)`;
      node.style.opacity = outCubic(prog(t, cp.in, 10)) * (1 - xe);
      node.parentElement.parentElement.style.visibility = (f < cp.in - 1 || xe >= 1) ? "hidden" : "visible";
    });
  };

  // Rectángulos de los elementos móviles: render.cjs los usa para decidir cuántas
  // muestras de motion blur necesita cada fotograma
  window.motionRects = function (t) {
    window.render(t);
    const els = [...cards.map(c => c.el), ...cards.map(c => c.obj), $("cap0"), $("cap1"), $("cap2"), $("kicker"), $("tl1"), $("tl2")];
    return els.map(e => { const r = e.getBoundingClientRect(); return [r.left, r.top, r.right, r.bottom]; });
  };

  window.setup = function () { measure(); window.render(0); };
  window.setup();
</script>
</body>
</html>
